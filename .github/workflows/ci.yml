name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The one source of truth for the version; the hook reads the same file.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Runs every workspace: the engine's frozen perft baselines, its bounded
      # differential sweep against the naive generator, the ARCHITECTURE.md §1
      # purity check, and the apps/web esbuild bundle.
      - run: npm test
